name: Supabase Database Backup

on:
  schedule:
    # Runs daily at 20:00 UTC (03:00 AM ICT / Bangkok time)
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: Create Encrypted Recovery Snapshot
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15

    steps:
      - name: Install PostgreSQL 17 client and GnuPG
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y postgresql-common gnupg gzip python3
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Dump, Verify Integrity, Compress, and Encrypt
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::Missing SUPABASE_DB_URL secret (use Supabase IPv4 Session Pooler URL on port 5432)."
            exit 1
          fi

          if [ -z "${BACKUP_PASSPHRASE:-}" ]; then
            echo "::error::Missing BACKUP_PASSPHRASE secret required for AES-256 GPG encryption."
            exit 1
          fi

          TIMESTAMP=$(date -u +"%Y-%m-%d-%H%M%S")
          RAW_SQL="backup.sql"
          ENCRYPTED_OUT="supabase-backup-${TIMESTAMP}.sql.gz.gpg"

          echo "Running pg_dump for public and auth schemas..."
          # Parse SUPABASE_DB_URL in Python and pass credentials via libpq PG* env vars
          # so raw special characters (%, $, @, :, #, /, ?) in passwords never break URI parsing.
          python3 - "$RAW_SQL" << 'PYEOF'
          import base64, os, re, subprocess, sys

          out_file = sys.argv[1]
          raw_url = os.environ["SUPABASE_DB_URL"].strip()
          rest = re.sub(r"^postgres(?:ql)?://", "", raw_url)

          if "@" not in rest or ":" not in rest.rsplit("@", 1)[0]:
              print("::error::SUPABASE_DB_URL must be in format postgresql://user:password@host:port/dbname", file=sys.stderr)
              sys.exit(1)

          userinfo, hostinfo = rest.rsplit("@", 1)
          user, password = userinfo.split(":", 1)

          if password.startswith("go-keyring-base64:"):
              password = base64.b64decode(password.split(":", 1)[1]).decode("utf-8")

          hostport, dbname = (hostinfo.split("/", 1) + ["postgres"])[:2]
          dbname = dbname.split("?", 1)[0] or "postgres"
          if ":" in hostport:
              host, port = hostport.rsplit(":", 1)
          else:
              host, port = hostport, "5432"

          env = os.environ.copy()
          env.update({
              "PGHOST": host,
              "PGPORT": port,
              "PGUSER": user,
              "PGPASSWORD": password,
              "PGDATABASE": dbname,
              "PGSSLMODE": "require",
          })

          cmd = [
              "/usr/lib/postgresql/17/bin/pg_dump",
              "--schema=public",
              "--schema=auth",
              "--clean",
              "--if-exists",
              "--no-owner",
              "--no-privileges",
              "--quote-all-identifiers",
              f"--file={out_file}",
          ]
          subprocess.run(cmd, env=env, check=True)
          PYEOF

          echo "Running pre-encryption integrity gate..."
          FILE_SIZE=$(wc -c < "$RAW_SQL")
          if [ "$FILE_SIZE" -le 102400 ]; then
            echo "::error::Integrity check failed: backup.sql is suspiciously small (${FILE_SIZE} bytes <= 100 KB)."
            exit 1
          fi

          for REQUIRED_TABLE in "rental_shops" "motorcycle_rentals" "canonical_motorcycle_models" "users"; do
            if ! grep -q "$REQUIRED_TABLE" "$RAW_SQL"; then
              echo "::error::Integrity check failed: expected table '${REQUIRED_TABLE}' not found in dump."
              exit 1
            fi
          done

          echo "Integrity check passed (${FILE_SIZE} bytes). Compressing and encrypting with AES-256 GPG..."
          gzip -9 "$RAW_SQL"

          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase-fd 0 \
            --output "$ENCRYPTED_OUT" \
            "${RAW_SQL}.gz" <<< "$BACKUP_PASSPHRASE"

          # Strictly remove compressed plaintext before uploading artifact
          rm -f "$RAW_SQL" "${RAW_SQL}.gz"

          if [ ! -s "$ENCRYPTED_OUT" ]; then
            echo "::error::Encrypted output file '${ENCRYPTED_OUT}' was not created or is empty."
            exit 1
          fi

          echo "BACKUP_FILE=${ENCRYPTED_OUT}" >> "$GITHUB_ENV"

      - name: Upload Encrypted Recovery Snapshot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 7
          if-no-files-found: error
